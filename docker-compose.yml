name: club-management-showcase
services:
  mysql:
    image: mysql:8.4
    container_name: club-showcase-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run demo:setup first}
      MYSQL_DATABASE: club_management_showcase
      MYSQL_USER: showcase_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run npm run demo:setup first}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13316}:3306"
    volumes:
      - showcase_mysql_data:/var/lib/mysql
      - ./deploy/init-showcase-test-db.sh:/docker-entrypoint-initdb.d/10-showcase-test.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  showcase_mysql_data:
